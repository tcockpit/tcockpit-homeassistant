send_command:
  name: Send command
  description: Queue any allowlisted TCockpit vehicle command (same queue as the app).
  fields:
    vin:
      required: true
      example: "5YJ3E7EB0KF000000"
      selector:
        text:
    command:
      required: true
      example: "set_charge_schedule"
      selector:
        text:
    parameters:
      required: false
      example:
        enabled: true
        hour: 7
        minute: 0
      selector:
        object:

valet_mode:
  name: Valet mode
  description: Enable or disable Valet mode. PIN is required for this call only and is never stored.
  fields:
    vin:
      required: true
      selector:
        text:
    enabled:
      required: true
      selector:
        boolean:
    pin:
      required: true
      example: "1234"
      selector:
        text:

speed_limit:
  name: Speed limit
  description: Activate, deactivate, or clear the vehicle speed-limit PIN. PIN is required for this call only and is never stored.
  fields:
    vin:
      required: true
      selector:
        text:
    action:
      required: true
      selector:
        select:
          options:
            - activate
            - deactivate
            - clear_pin
    pin:
      required: true
      example: "1234"
      selector:
        text:
